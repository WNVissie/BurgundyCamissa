# Netlify Configuration for React + Vite App

[build]
  # Directory with the frontend code
  base = "shift-roster-frontend"
  
  # Build command
  command = "npm install && npm run build"
  
  # Directory with built files
  publish = "dist"

# Redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (set these in Netlify Dashboard)
# VITE_API_URL = https://burgundycamissa-1.onrender.com

# Build settings
[build.environment]
  NODE_VERSION = "18"
